{% extends "students/header.html" %}
{% block content %}

<style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        margin: 0;
        background: #f4f7fb;
    }

    .delete-page {
        width: 600px;
        margin: 50px auto;
        padding: 30px 35px;
        background: #ffffff;
        border-radius: 10px;
        border: 1px solid #e1e7ee;
        box-shadow: 0 6px 20px rgba(0, 66, 130, 0.08);
    }

    .page-header {
        text-align: center;
        margin-bottom: 25px;
        padding-bottom: 17px;
        border-bottom: 1px solid #e5e9ee;
    }

    .page-header h1 {
        color: #004282;
        font-size: 25px;
        margin-bottom: 5px;
    }

    .page-header p {
        color: #fe0000;
        font-size: 13px;
        font-weight: 600;
    }

    .warning-message {
        background: #fff3cd;
        color: #856404;
        border: 1px solid #ffe69c;
        padding: 10px 12px;
        border-radius: 5px;
        text-align: center;
        font-size: 13px;
        margin-bottom: 20px;
    }

    .success-message {
        background: #e8f7ee;
        color: #198754;
        border: 1px solid #b7e4c7;
        padding: 9px 12px;
        border-radius: 5px;
        text-align: center;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 18px;
    }

    .error-message {
        background: #fdecec;
        color: #dc3545;
        border: 1px solid #f5c2c7;
        padding: 9px 12px;
        border-radius: 5px;
        text-align: center;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 18px;
    }

    .form-group {
        margin-bottom: 18px;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        color: #26364a;
        font-size: 13px;
        font-weight: 600;
    }

    .form-group input {
        width: 100%;
        height: 40px;
        padding: 0 11px;
        border: 1px solid #d4dce5;
        border-radius: 5px;
        outline: none;
        font-size: 13px;
    }

    .form-group input:focus {
        border-color: #004282;
        box-shadow: 0 0 0 3px rgba(0, 66, 130, 0.09);
    }

    .buttons {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 25px;
        padding-top: 18px;
        border-top: 1px solid #e5e9ee;
    }

    .buttons button,
    .buttons a {
        height: 37px;
        padding: 0 20px;
        border: none;
        border-radius: 5px;
        color: white;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .delete-btn {
        background: #f01026;
    }

    .delete-btn:hover {
        background: #d20317;
    }

    .back-btn {
        background: #004282;
    }

    .back-btn:hover {
        background: #003466;
    }

    @media (max-width: 700px) {

        .delete-page {
            width: 92%;
            margin: 25px auto;
            padding: 25px 22px;
        }

        .buttons {
            flex-direction: column;
        }

        .buttons button,
        .buttons a {
            width: 100%;
        }

    }

</style>

<div class="delete-page">


<div class="page-header">

    <h1>GTEC Education</h1>

    <p>Delete Student</p>

</div>


<div class="warning-message">

    ⚠ Enter the registration number of the student you want to delete.

</div>


{% if success %}

    <div class="success-message">

        ✓ {{ success }}

    </div>

{% endif %}


{% if error %}

    <div class="error-message">

        ⚠ {{ error }}

    </div>

{% endif %}


<form method="POST">

    {% csrf_token %}


    <div class="form-group">

        <label>Registration No</label>

        <input
            type="text"
            name="registration_no"
            placeholder="Enter registration number"
            required
        >

    </div>


    <div class="buttons">

        <a
            href="{% url 'home' %}"
            class="back-btn"
        >
            Back to Home
        </a>


        <button
            type="submit"
            name="action"
            value="delete"
            class="delete-btn"
            onclick="return confirm('Are you sure you want to delete this student?');"
        >
            Delete Student
        </button>

    </div>

</form>


</div>

{% endblock %}
